<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial Core Energy -->
    <radialGradient id="tf-core-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Top Left Wing (Indigo-Violet) -->
    <linearGradient id="tf-w-left" x1="16" y1="28" x2="42" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Top Right Wing (Electric Cyan) -->
    <linearGradient id="tf-w-right" x1="58" y1="28" x2="84" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Center Top Crest (Sapphire Highlight) -->
    <linearGradient id="tf-w-top" x1="32" y1="12" x2="68" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Central Pillar Stem Left (Deep Indigo Shadow) -->
    <linearGradient id="tf-stem-left" x1="38" y1="46" x2="50" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Central Pillar Stem Right (Illuminated Cyan) -->
    <linearGradient id="tf-stem-right" x1="50" y1="46" x2="62" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Sharp Bevel Edge Light -->
    <linearGradient id="tf-edge-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="48" r="42" fill="url(#tf-core-glow)" />

  <!-- === CENTRAL STEM (The Base of the T) === -->
  <!-- Stem Left Facet -->
  <path d="M 50 48 L 38 41 L 38 73 L 50 80 Z"
        fill="url(#tf-stem-left)"
        stroke="url(#tf-edge-light)"
        stroke-width="0.8"
        stroke-linejoin="round" />

  <!-- Stem Right Facet -->
  <path d="M 50 48 L 62 41 L 62 73 L 50 80 Z"
        fill="url(#tf-stem-right)"
        stroke="url(#tf-edge-light)"
        stroke-width="0.8"
        stroke-linejoin="round" />

  <!-- === TOP HORIZONTAL BAR OF THE T (Wings & Crest) === -->
  <!-- Top Center Roof -->
  <path d="M 50 16 L 66 25 L 50 34 L 34 25 Z"
        fill="url(#tf-w-top)"
        stroke="url(#tf-edge-light)"
        stroke-width="0.8"
        stroke-linejoin="round" />

  <!-- Left Wing -->
  <g filter="drop-shadow(0 2px 8px rgba(99, 102, 241, 0.4))">
    <path d="M 33 27 L 17 36 L 17 56 L 33 47 Z"
          fill="url(#tf-w-left)"
          stroke="url(#tf-edge-light)"
          stroke-width="0.8"
          stroke-linejoin="round" />
  </g>

  <!-- Right Wing -->
  <g filter="drop-shadow(0 2px 8px rgba(56, 189, 248, 0.4))">
    <path d="M 67 27 L 83 36 L 83 56 L 67 47 Z"
          fill="url(#tf-w-right)"
          stroke="url(#tf-edge-light)"
          stroke-width="0.8"
          stroke-linejoin="round" />
  </g>

  <!-- Interlocking Bridge Node (Core diamond connecting Bar & Stem) -->
  <path d="M 50 36 L 61 42.5 L 50 49 L 39 42.5 Z"
        fill="#ffffff"
        fill-opacity="0.9"
        filter="drop-shadow(0 0 6px #38bdf8)" />
</svg>
